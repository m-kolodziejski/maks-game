<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Dragon &amp; Sheep Catcher</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; touch-action: none; background: #1a1a2e; }
    canvas { display: block; position: fixed; inset: 0; }
    #ui {
      position: fixed; inset: 0;
      pointer-events: none;
      display: flex; flex-direction: column;
      justify-content: flex-end; align-items: stretch;
    }
    #btns {
      pointer-events: all;
      display: flex; justify-content: space-between;
      padding: 12px 20px 24px;
      background: linear-gradient(transparent, rgba(0,0,0,0.28));
    }
    .btn {
      width: 92px; height: 92px;
      background: rgba(255,255,255,0.22);
      border: 3px solid rgba(255,255,255,0.45);
      border-radius: 20px;
      font-size: 42px; color: #fff;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      user-select: none; -webkit-user-select: none;
      touch-action: none;
      transition: background 0.08s, transform 0.08s;
    }
    .btn.pressed { background: rgba(255,255,255,0.48); transform: scale(0.94); }
  </style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <div id="btns">
    <button class="btn" id="bL">&#9664;</button>
    <button class="btn" id="bR">&#9654;</button>
  </div>
</div>
<script>
'use strict';

/* ═══════════════════════════════════════════════════════
   CANVAS SETUP
═══════════════════════════════════════════════════════ */
const canvas = document.getElementById('c');
const ctx    = canvas.getContext('2d');
let W = 0, H = 0;

function resize() {
  W = canvas.width  = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', () => {
  resize();
  if (gs === GS.START) { initClouds(); drawStart(); }
  if (gs === GS.OVER)  drawOver();
});

/* ═══════════════════════════════════════════════════════
   CONSTANTS & STATE
═══════════════════════════════════════════════════════ */
const GS = { START: 0, PLAY: 1, OVER: 2 };
let gs     = GS.START;
let score  = 0;
let lives  = 3;
let tick   = 0;
let spawnT = 0;
let shake  = 0;

const DW = 90;   // dragon width
const DH = 80;   // dragon height
const BTN_H = 128; // height reserved for on-screen buttons

function groundY() { return H - BTN_H; }

let dragon     = { x: 0, y: 0, wing: 0 };
let sheep      = [];
let particles  = [];
let clouds     = [];
let keys       = {};
let pLeft      = false;
let pRight     = false;

/* ═══════════════════════════════════════════════════════
   INPUT
═══════════════════════════════════════════════════════ */
document.addEventListener('keydown', e => {
  keys[e.key] = true;
  if (gs !== GS.PLAY) beginGame();
});
document.addEventListener('keyup', e => { keys[e.key] = false; });
canvas.addEventListener('pointerdown', () => { if (gs !== GS.PLAY) beginGame(); });

function setupBtn(el, side) {
  const dn = e => { e.preventDefault(); if (side === 'L') pLeft = true; else pRight = true; el.classList.add('pressed'); };
  const up = e => { e.preventDefault(); if (side === 'L') pLeft = false; else pRight = false; el.classList.remove('pressed'); };
  el.addEventListener('touchstart',  dn, { passive: false });
  el.addEventListener('touchend',    up, { passive: false });
  el.addEventListener('touchcancel', up, { passive: false });
  el.addEventListener('mousedown', dn);
  document.addEventListener('mouseup', up);
}
setupBtn(document.getElementById('bL'), 'L');
setupBtn(document.getElementById('bR'), 'R');

/* ═══════════════════════════════════════════════════════
   GAME INIT
═══════════════════════════════════════════════════════ */
function beginGame() {
  score = 0; lives = 3; tick = 0; spawnT = 0; shake = 0;
  sheep = []; particles = [];
  dragon.x = W / 2 - DW / 2;
  dragon.y = groundY() - DH;
  dragon.wing = 0;
  initClouds();
  gs = GS.PLAY;
}

/* ═══════════════════════════════════════════════════════
   CLOUDS
═══════════════════════════════════════════════════════ */
function initClouds() {
  clouds = Array.from({ length: 7 }, () => ({
    x:   Math.random() * W,
    y:   25 + Math.random() * (groundY() * 0.42),
    spd: 0.18 + Math.random() * 0.28,
    sc:  0.55 + Math.random() * 0.9,
  }));
}
initClouds();

function tickClouds() {
  for (const c of clouds) {
    c.x += c.spd;
    if (c.x > W + 160) c.x = -160;
  }
}

function drawCloud(x, y, sc) {
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(sc, sc);
  ctx.fillStyle = 'rgba(255,255,255,0.78)';
  ctx.beginPath();
  ctx.arc(0,   0,  28, 0, Math.PI * 2);
  ctx.arc(38, -8,  22, 0, Math.PI * 2);
  ctx.arc(68,  2,  25, 0, Math.PI * 2);
  ctx.arc(34,  10, 22, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

/* ═══════════════════════════════════════════════════════
   SPRITE: SHEEP  (centred at s.x, s.y)
═══════════════════════════════════════════════════════ */
function drawSheep(s) {
  const sc = s.scale;
  ctx.save();
  ctx.translate(s.x, s.y);
  ctx.scale(sc, sc);

  // Ground shadow
  ctx.fillStyle = 'rgba(0,0,0,0.12)';
  ctx.beginPath();
  ctx.ellipse(0, 28, 20, 5, 0, 0, Math.PI * 2);
  ctx.fill();

  // Legs (four stubby sticks)
  ctx.strokeStyle = '#3a3a3a';
  ctx.lineWidth = 4;
  ctx.lineCap = 'round';
  const legs = [[-13,8,-15,27],[-5,10,-6,27],[5,10,6,27],[13,8,15,27]];
  for (const [x1,y1,x2,y2] of legs) {
    ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
  }

  // Wool body — cluster of overlapping circles
  ctx.fillStyle = '#efefef';
  const bumps = [[0,0,20],[-14,-7,10],[-4,-14,9],[8,-12,10],[16,-4,9],[17,5,8],[-16,4,9],[-8,10,8],[6,10,9]];
  for (const [bx,by,br] of bumps) {
    ctx.beginPath(); ctx.arc(bx, by, br, 0, Math.PI * 2); ctx.fill();
  }
  // subtle shading on bumps
  ctx.fillStyle = 'rgba(0,0,0,0.05)';
  for (const [bx,by,br] of bumps) {
    ctx.beginPath(); ctx.arc(bx + 3, by + 4, br * 0.6, 0, Math.PI * 2); ctx.fill();
  }

  // Face
  ctx.fillStyle = '#8a8a8a';
  ctx.beginPath(); ctx.ellipse(-23,-1,10,8.5,-0.15,0,Math.PI*2); ctx.fill();

  // Ears
  ctx.fillStyle = '#ababab';
  ctx.beginPath(); ctx.ellipse(-26,-9,5,3.5,-0.8,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(-26, 7,5,3.5, 0.8,0,Math.PI*2); ctx.fill();
  // inner ear pink
  ctx.fillStyle = '#e8aabb';
  ctx.beginPath(); ctx.ellipse(-26,-9,3,2,-0.8,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(-26, 7,3,2, 0.8,0,Math.PI*2); ctx.fill();

  // Eye (white sclera + pupil)
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.ellipse(-24,-3,3.5,3,0,0,Math.PI*2); ctx.fill();
  ctx.fillStyle = '#111';
  ctx.beginPath(); ctx.arc(-23.5,-3,1.8,0,Math.PI*2); ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(-22.8,-4,0.7,0,Math.PI*2); ctx.fill();

  // Nose
  ctx.fillStyle = '#c08090';
  ctx.beginPath(); ctx.ellipse(-31,0,3,2,0,0,Math.PI*2); ctx.fill();

  ctx.restore();
}

/* ═══════════════════════════════════════════════════════
   SPRITE: DRAGON  (top-left corner at d.x, d.y)
═══════════════════════════════════════════════════════ */
function drawDragon(d) {
  const wa = Math.sin(d.wing * 0.14) * 0.44; // wing beat
  ctx.save();
  // pivot at visual centre of dragon body
  ctx.translate(d.x + DW / 2, d.y + DH / 2 + 2);

  // Shadow
  ctx.fillStyle = 'rgba(0,0,0,0.14)';
  ctx.beginPath(); ctx.ellipse(0, 42, 28, 7, 0, 0, Math.PI * 2); ctx.fill();

  // ── Tail ──
  ctx.save();
  ctx.strokeStyle = '#2d7a40'; ctx.lineWidth = 10; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(20,16); ctx.quadraticCurveTo(54,28,48,6); ctx.stroke();
  ctx.fillStyle = '#1b5a2d';
  ctx.beginPath(); ctx.moveTo(48,6); ctx.lineTo(58,-1); ctx.lineTo(54,12); ctx.closePath(); ctx.fill();
  ctx.restore();

  // ── Left wing (behind body) ──
  ctx.save();
  ctx.rotate(wa + 0.28);
  ctx.fillStyle = '#1e6e30';
  ctx.beginPath();
  ctx.moveTo(-10,-5);
  ctx.bezierCurveTo(-44,-44,-64,-16,-50,14);
  ctx.bezierCurveTo(-34,6,-18,6,-10,12);
  ctx.closePath(); ctx.fill();
  // membrane veins
  ctx.strokeStyle = '#145222'; ctx.lineWidth = 1.3;
  for (const wx of [-38,-48,-54]) {
    ctx.beginPath(); ctx.moveTo(-10,-5); ctx.lineTo(wx,-12+(wx+54)*0.38); ctx.stroke();
  }
  ctx.restore();

  // ── Body ──
  const bg = ctx.createRadialGradient(-6,-10,4,0,0,32);
  bg.addColorStop(0,'#68ee76'); bg.addColorStop(1,'#2a7a3a');
  ctx.fillStyle = bg;
  ctx.beginPath(); ctx.ellipse(0,8,24,30,0,0,Math.PI*2); ctx.fill();

  // Belly plate
  ctx.fillStyle = '#aaeeaa';
  ctx.beginPath(); ctx.ellipse(0,14,13,19,0,0,Math.PI*2); ctx.fill();
  // scale segments
  ctx.strokeStyle = '#90d890'; ctx.lineWidth = 0.9;
  for (let ys = 2; ys < 30; ys += 7) {
    ctx.beginPath(); ctx.ellipse(0, ys, Math.max(3,9-ys*0.08), 2.5, 0, 0, Math.PI*2); ctx.stroke();
  }

  // ── Right wing (front) ──
  ctx.save();
  ctx.rotate(-wa - 0.28);
  ctx.fillStyle = '#2a8e40';
  ctx.beginPath();
  ctx.moveTo(10,-5);
  ctx.bezierCurveTo(44,-44,64,-16,50,14);
  ctx.bezierCurveTo(34,6,18,6,10,12);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = '#1e6830'; ctx.lineWidth = 1.3;
  for (const wx of [38,48,54]) {
    ctx.beginPath(); ctx.moveTo(10,-5); ctx.lineTo(wx,-12+(54-wx)*0.38); ctx.stroke();
  }
  ctx.restore();

  // ── Head ──
  ctx.fillStyle = '#3a9e4c';
  ctx.beginPath(); ctx.ellipse(-2,-22,18,14,-0.18,0,Math.PI*2); ctx.fill();

  // Snout
  ctx.fillStyle = '#62e870';
  ctx.beginPath(); ctx.ellipse(-17,-21,10.5,8,-0.25,0,Math.PI*2); ctx.fill();

  // Horn
  ctx.fillStyle = '#d4a830';
  ctx.beginPath(); ctx.moveTo(4,-34); ctx.lineTo(10,-51); ctx.lineTo(16,-34); ctx.closePath(); ctx.fill();
  ctx.strokeStyle = '#ffe860'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(7,-36); ctx.lineTo(10,-48); ctx.stroke();

  // Eyebrow ridge
  ctx.strokeStyle = '#228832'; ctx.lineWidth = 2.5; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(-11,-31); ctx.lineTo(-1,-33); ctx.stroke();

  // Eye
  ctx.fillStyle = '#111';
  ctx.beginPath(); ctx.arc(-4,-25,5.5,0,Math.PI*2); ctx.fill();
  ctx.fillStyle = '#ff5500';
  ctx.beginPath(); ctx.arc(-4,-25,3.8,0,Math.PI*2); ctx.fill();
  ctx.fillStyle = '#ff9900';
  ctx.beginPath(); ctx.arc(-4,-25,2.2,0,Math.PI*2); ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(-2.5,-27,1.2,0,Math.PI*2); ctx.fill();

  // Nostrils
  ctx.fillStyle = '#1a5a2a';
  ctx.beginPath(); ctx.arc(-23,-24,2,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(-23,-19,2,0,Math.PI*2); ctx.fill();

  // ── Fire breath ──
  const ft = Date.now() * 0.013;
  const fireData = [
    [0, '#ff3300', 7],
    [1, '#ff7700', 5.5],
    [2, '#ffcc00', 4],
  ];
  for (const [i, col, r] of fireData) {
    const fi = (ft + i * 0.65) % 3;
    const alpha = (1 - fi / 3) * 0.92;
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.fillStyle = col;
    ctx.beginPath();
    ctx.ellipse(-29 - fi * 8, -21 + Math.sin(ft + i) * 2.5,
                Math.max(0.5, r - fi * 0.5), Math.max(0.3, (r - fi * 0.5) * 0.55),
                0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  ctx.restore();
}

/* ═══════════════════════════════════════════════════════
   PARTICLES
═══════════════════════════════════════════════════════ */
const BURST_COLS = ['#FFD700','#FF8C00','#FFA500','#FF4500','#FFFF44','#FF6600'];

function catchBurst(x, y) {
  for (let i = 0; i < 15; i++) {
    const ang = (i / 15) * Math.PI * 2;
    const sp  = 2 + Math.random() * 3.5;
    particles.push({
      x, y,
      vx: Math.cos(ang) * sp,
      vy: Math.sin(ang) * sp - 1.2,
      life: 1,
      col: BURST_COLS[i % BURST_COLS.length],
      r: 3.5 + Math.random() * 4,
    });
  }
}

function tickParticles() {
  particles = particles.filter(p => p.life > 0);
  for (const p of particles) {
    p.x += p.vx; p.y += p.vy;
    p.vy += 0.1; p.vx *= 0.96;
    p.life -= 0.027;
  }
}

function drawParticles() {
  for (const p of particles) {
    const sz = p.r * p.life;
    ctx.save();
    ctx.globalAlpha = p.life;
    ctx.fillStyle = p.col;
    // 4-point star
    ctx.beginPath();
    for (let i = 0; i < 8; i++) {
      const ang = i * Math.PI / 4;
      const rad = (i % 2 === 0) ? sz * 1.7 : sz * 0.65;
      const px2 = p.x + Math.cos(ang) * rad;
      const py2 = p.y + Math.sin(ang) * rad;
      if (i === 0) ctx.moveTo(px2, py2); else ctx.lineTo(px2, py2);
    }
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }
}

/* ═══════════════════════════════════════════════════════
   DIFFICULTY
═══════════════════════════════════════════════════════ */
function getDiff() {
  if (score >= 30) return { spd: 5.0, interval: 65, max: 4 };
  if (score >= 20) return { spd: 4.0, interval: 80, max: 3 };
  if (score >= 10) return { spd: 3.2, interval: 100, max: 2 };
  return                   { spd: 2.2, interval: 130, max: 1 };
}

/* ═══════════════════════════════════════════════════════
   SHEEP SPAWNER
═══════════════════════════════════════════════════════ */
function spawnSheep() {
  const d = getDiff();
  if (sheep.length >= d.max + 2) return;
  const margin = 55;
  sheep.push({
    x:     margin + Math.random() * (W - 2 * margin),
    y:     -40,
    spd:   d.spd + Math.random() * 1.1,
    scale: 0.75 + Math.random() * 0.4,
    wob:   Math.random() * Math.PI * 2,
  });
}

/* ═══════════════════════════════════════════════════════
   BACKGROUND
═══════════════════════════════════════════════════════ */
function drawBG() {
  const gy = groundY();
  // Sky gradient
  const sky = ctx.createLinearGradient(0, 0, 0, gy);
  sky.addColorStop(0,   '#5baee8');
  sky.addColorStop(0.65,'#c0e8ff');
  sky.addColorStop(1,   '#a4d8a4');
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, W, H);

  // Clouds
  for (const c of clouds) drawCloud(c.x, c.y, c.sc);

  // Ground base
  ctx.fillStyle = '#5a9e4a';
  ctx.fillRect(0, gy, W, H - gy);

  // Edge stripe
  ctx.fillStyle = '#3e7e32';
  ctx.fillRect(0, gy - 5, W, 9);

  // Grass tufts
  ctx.fillStyle = '#3a7230';
  for (let gx = 0; gx < W; gx += 22) {
    ctx.beginPath();
    ctx.moveTo(gx,    gy);
    ctx.lineTo(gx+5,  gy - 13);
    ctx.lineTo(gx+11, gy);
    ctx.fill();
  }
}

/* ═══════════════════════════════════════════════════════
   HUD
═══════════════════════════════════════════════════════ */
function drawHUD() {
  ctx.save();
  // Score
  ctx.font = 'bold 30px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillStyle = 'rgba(0,0,0,0.35)';
  ctx.fillText('Score: ' + score, W / 2 + 2, 48);
  ctx.fillStyle = '#ffffff';
  ctx.fillText('Score: ' + score, W / 2, 46);
  // Lives
  ctx.font = '28px sans-serif';
  ctx.textAlign = 'left';
  for (let i = 0; i < 3; i++) {
    ctx.globalAlpha = i < lives ? 1 : 0.2;
    ctx.fillText('\u2764', 14 + i * 36, 46);
  }
  ctx.restore();
}

/* ═══════════════════════════════════════════════════════
   OVERLAY HELPERS
═══════════════════════════════════════════════════════ */
function rrect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.arcTo(x + w, y, x + w, y + r, r);
  ctx.lineTo(x + w, y + h - r);
  ctx.arcTo(x + w, y + h, x + w - r, y + h, r);
  ctx.lineTo(x + r, y + h);
  ctx.arcTo(x, y + h, x, y + h - r, r);
  ctx.lineTo(x, y + r);
  ctx.arcTo(x, y, x + r, y, r);
  ctx.closePath();
}

/* ═══════════════════════════════════════════════════════
   START SCREEN
═══════════════════════════════════════════════════════ */
function drawStart() {
  drawBG();
  ctx.save();
  const pw = 340, ph = 320;
  const px = W / 2 - pw / 2, py = H / 2 - ph / 2 - 30;

  ctx.fillStyle = 'rgba(10,10,30,0.74)';
  rrect(px, py, pw, ph, 22); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.18)'; ctx.lineWidth = 2; ctx.stroke();

  ctx.textAlign = 'center';
  ctx.font = '56px sans-serif';
  ctx.fillText('\uD83D\uDC09', W / 2, py + 76);

  ctx.font = 'bold 36px sans-serif'; ctx.fillStyle = '#FFD700';
  ctx.fillText('Dragon Catcher!', W / 2, py + 122);

  ctx.font = '20px sans-serif'; ctx.fillStyle = '#ddd';
  ctx.fillText('Catch the falling sheep!', W / 2, py + 162);
  ctx.fillText('Don\u2019t let them hit the ground!', W / 2, py + 192);

  ctx.fillStyle = '#3dcc56';
  rrect(W / 2 - 108, py + 222, 216, 56, 14); ctx.fill();
  ctx.font = 'bold 26px sans-serif'; ctx.fillStyle = '#fff';
  ctx.fillText('\u25BA  PLAY', W / 2, py + 258);

  ctx.restore();
}

/* ═══════════════════════════════════════════════════════
   GAME OVER SCREEN
═══════════════════════════════════════════════════════ */
function drawOver() {
  ctx.save();
  ctx.fillStyle = 'rgba(0,0,0,0.55)'; ctx.fillRect(0, 0, W, H);
  const pw = 340, ph = 290;
  const px = W / 2 - pw / 2, py = H / 2 - ph / 2 - 30;

  ctx.fillStyle = 'rgba(15,15,40,0.92)';
  rrect(px, py, pw, ph, 22); ctx.fill();
  ctx.strokeStyle = 'rgba(255,80,80,0.5)'; ctx.lineWidth = 2; ctx.stroke();

  ctx.textAlign = 'center';
  ctx.font = 'bold 46px sans-serif'; ctx.fillStyle = '#ff4455';
  ctx.fillText('Game Over!', W / 2, py + 70);
  ctx.font = 'bold 34px sans-serif'; ctx.fillStyle = '#FFD700';
  ctx.fillText('Score: ' + score, W / 2, py + 118);

  const msg = score >= 30 ? '\uD83C\uDF1F Dragon Master!'
            : score >= 15 ? '\uD83D\uDD25 Blazing run!'
            : score >= 5  ? '\uD83D\uDC4D Not bad!'
            : '\uD83D\uDC11 Keep trying!';
  ctx.font = '23px sans-serif'; ctx.fillStyle = '#ccc';
  ctx.fillText(msg, W / 2, py + 158);

  ctx.fillStyle = '#3dcc56';
  rrect(W / 2 - 118, py + 190, 236, 56, 14); ctx.fill();
  ctx.font = 'bold 24px sans-serif'; ctx.fillStyle = '#fff';
  ctx.fillText('\u25BA  PLAY AGAIN', W / 2, py + 226);

  ctx.restore();
}

/* ═══════════════════════════════════════════════════════
   UPDATE
═══════════════════════════════════════════════════════ */
function update() {
  tick++;
  dragon.wing++;

  // Dragon movement (7 px/frame)
  const spd = 7;
  if (keys['ArrowLeft']  || pLeft)  dragon.x -= spd;
  if (keys['ArrowRight'] || pRight) dragon.x += spd;
  dragon.x = Math.max(0, Math.min(W - DW, dragon.x));
  dragon.y = groundY() - DH; // pin to ground line

  // Spawn sheep
  spawnT++;
  if (spawnT >= getDiff().interval) { spawnSheep(); spawnT = 0; }

  // Move sheep (slight horizontal sway)
  for (const s of sheep) {
    s.y   += s.spd;
    s.wob += 0.05;
    s.x   += Math.sin(s.wob) * 0.55;
  }

  // Collision
  const dCX = dragon.x + DW / 2;
  const dCY = dragon.y + DH / 2;

  sheep = sheep.filter(s => {
    const dx = dCX - s.x, dy = dCY - s.y;
    if (dx * dx + dy * dy < (60 * s.scale) * (60 * s.scale)) {
      // Caught!
      score++;
      catchBurst(s.x, s.y);
      return false;
    }
    if (s.y > groundY() + 15) {
      // Missed!
      lives--;
      shake = 18;
      return false;
    }
    return true;
  });

  if (lives <= 0) gs = GS.OVER;

  tickClouds();
  tickParticles();
  if (shake > 0) shake--;
}

/* ═══════════════════════════════════════════════════════
   RENDER
═══════════════════════════════════════════════════════ */
function render() {
  ctx.save();
  if (shake > 0) {
    ctx.translate(
      (Math.random() - 0.5) * shake * 1.2,
      (Math.random() - 0.5) * shake * 1.2
    );
  }
  drawBG();
  for (const s of sheep) drawSheep(s);
  drawDragon(dragon);
  drawParticles();
  drawHUD();
  ctx.restore();
}

/* ═══════════════════════════════════════════════════════
   MAIN LOOP
═══════════════════════════════════════════════════════ */
function loop() {
  if      (gs === GS.START) drawStart();
  else if (gs === GS.PLAY)  { update(); render(); }
  else if (gs === GS.OVER)  { render(); drawOver(); }
  requestAnimationFrame(loop);
}

dragon.x = W / 2 - DW / 2;
dragon.y = groundY() - DH;
loop();
</script>
</body>
</html>
